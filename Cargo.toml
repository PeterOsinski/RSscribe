[package]
name = "voice-paste"
version = "0.1.0"
edition = "2021"

[dependencies]
# background global keyboard listener
rdev = "0.5"

# mic capture + WAV writing
cpal = "0.15"
hound = "3.5"

# HTTP client for downloads + talking to the local whisper-server
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }

# clipboard + simulated paste keystroke
arboard = "3"
enigo = "0.2"

anyhow = "1"
log = "0.4"
env_logger = "0.11"

# menu-bar status icon
tray-icon = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSString", "NSObjCRuntime"] }

[profile.release]
opt-level = 2
